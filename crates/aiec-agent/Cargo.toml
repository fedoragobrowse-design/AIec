[package]
name = "aiec-agent"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"
description = "A very small coding-agent harness that runs inside an AIec sandbox"

[[bin]]
name = "aiec-agent"
path = "src/main.rs"

# Deliberately few. This harness is baked into a short-lived VM and is judged on
# cold start, resident size and binary size, so every dependency is something the
# agent loop actually needs. Nothing here pulls in a TUI, a plugin system, a
# database, or a language runtime.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "process", "time", "io-util", "fs", "signal", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "http2"] }
futures = "0.3"
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "json"] }
uuid = { version = "1", features = ["v7", "serde"] }
zeroize = "1"
# The syscall interface, not a feature. It is here for exactly one call:
# killing a timed-out command's whole process group, because a shell that
# backgrounds a job and then waits is killed by killing the shell.
libc = "0.2"
