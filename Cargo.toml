[workspace]
resolver = "3"
members = [
  "crates/agentforge-core",
  "crates/agentforge-storage",
  "crates/agentforge-runtime",
  "crates/agentforge-network-linux",
  "crates/agentforge-api",
  "crates/agentforge-client",
  "crates/agentforge-cli",
  "guest/agentforge-guest",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
agentforge-core = { path = "crates/agentforge-core" }
agentforge-storage = { path = "crates/agentforge-storage" }
agentforge-runtime = { path = "crates/agentforge-runtime" }
agentforge-network-linux = { path = "crates/agentforge-network-linux" }
agentforge-client = { path = "crates/agentforge-client" }
agentforge-api = { path = "crates/agentforge-api" }
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
bytes = "1.10"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
futures = "0.3"
hex = "0.4"
hmac = "0.12"
http = "1.3"
libc = "0.2"
metrics = "0.24"
metrics-exporter-prometheus = "0.17"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
thiserror = "2.0"
tokio = { version = "1.45", features = ["full"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["trace", "request-id", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.17", features = ["v4", "v7", "serde"] }
zeroize = { version = "1.8", features = ["derive"] }
