[workspace]
resolver = "3"
members = [
  "crates/aiec-core",
  "crates/aiec-storage",
  "crates/aiec-runtime",
  "crates/aiec-network-linux",
  "crates/aiec-guard",
  "crates/aiec-api",
  "crates/aiec-client",
  "crates/aiec-cli",
  "crates/aiec-mcp",
  "crates/aiec-agent",
  "guest/aiec-guest",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
aiec-core = { path = "crates/aiec-core" }
aiec-storage = { path = "crates/aiec-storage" }
aiec-runtime = { path = "crates/aiec-runtime" }
aiec-network-linux = { path = "crates/aiec-network-linux" }
aiec-guard = { path = "crates/aiec-guard" }
aiec-client = { path = "crates/aiec-client" }
aiec-api = { path = "crates/aiec-api" }
aiec-mcp = { path = "crates/aiec-mcp" }
bollard = "0.21.1"
anyhow = "1.0"
tar = "0.4"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
rustls = { version = "0.23", features = ["aws-lc-rs"] }
base64 = "0.22"
bytes = "1.10"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
futures = "0.3"
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
http = "1.3"
libc = "0.2"
parking_lot = "0.12"
metrics = "0.24"
metrics-exporter-prometheus = "0.17"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
thiserror = "2.0"
tokio = { version = "1.45", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["trace", "request-id", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.17", features = ["v4", "v7", "serde"] }
url = "2"
zeroize = { version = "1.8", features = ["derive"] }
serde_yaml_ng = "0.10"
ipnet = { version = "2", features = ["serde"] }
hickory-proto = "0.25"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }

# The agent harness ships inside every disposable VM, so it is optimised for
# size and cold start rather than for build speed. It gets its own profile
# rather than changing `release`, because the servers and CLIs in this workspace
# have different priorities and should not inherit this trade.
[profile.harness]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
