# AIec website — Cloudflare Workers with static assets.
#
# Build the site first:  python3 web/build.py
# Deploy with:           npx wrangler deploy
#
# The site is plain static HTML built by `web/build.py`; there is no framework
# and no bundler. `web/dist/` holds only rendered pages, generated cards and
# the assets they link to.
#
# Assets come from `./dist`, never from `./`. With `./`, the publish root was
# also the source root, so the deployed site served `/build.py` and
# `/pages/home.html` — the renderer source and an unrendered fragment — to
# anyone who asked for them. `web/build.py` refuses to write a publish root
# that contains source; this is the other half of that guarantee.

name = "aiec-site"
main = "src/worker.js"
compatibility_date = "2025-01-01"

# One hostname: the documentation site. AIec is open source, so there is no
# hosted API to route to — a reader runs the control plane on their own hardware.
# Note: TOML tables are greedy, so `routes` must appear before any [table].
routes = [
  { pattern = "aiec.gobrowse.dev", custom_domain = true },
]

[assets]
directory = "./dist"
binding = "ASSETS"
# Extensionless routes such as /docs are served from /docs/index.html.
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

